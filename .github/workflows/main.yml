name: Build YT Guard APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Generate Android Gradle Files & Merge SPCK Code
        run: |
          mkdir -p /tmp/spck_backup
          cp -r . /tmp/spck_backup/
          flutter create --org com.rohit --project-name ytguard --platforms=android .
          rm -f android/app/src/main/kotlin/com/rohit/ytguard/MainActivity.kt
          cp -rf /tmp/spck_backup/* .
          if [ -f lib/main.dart ]; then
            sed -i 's/CardThemeData/CardTheme/g' lib/main.dart
          fi
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/g' android/app/build.gradle

      - name: Get Flutter Packages
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: YT-Guard-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
